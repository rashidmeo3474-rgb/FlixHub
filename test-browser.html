<!DOCTYPE html>
<html>
<head>
    <title>FlixHub Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #0a0a0f; 
            color: white; 
        }
        .test-result { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background: #1a5a1a; }
        .error { background: #5a1a1a; }
        iframe { 
            width: 100%; 
            height: 400px; 
            border: 1px solid #333; 
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>FlixHub Loading Test</h1>
    <div id="results"></div>
    
    <h2>Website Preview</h2>
    <iframe src="http://localhost:5173" onload="checkLoad()" onerror="checkError()"></iframe>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, isError = false) {
            const div = document.createElement('div');
            div.className = `test-result ${isError ? 'error' : 'success'}`;
            div.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            results.appendChild(div);
        }
        
        function checkLoad() {
            addResult('✅ Website loaded successfully in iframe');
        }
        
        function checkError() {
            addResult('❌ Website failed to load in iframe', true);
        }
        
        // Test fetch to check if server is responding
        fetch('http://localhost:5173')
            .then(response => {
                if (response.ok) {
                    addResult('✅ Server is responding (HTTP ' + response.status + ')');
                } else {
                    addResult('❌ Server responded with error: HTTP ' + response.status, true);
                }
            })
            .catch(error => {
                addResult('❌ Cannot connect to server: ' + error.message, true);
            });
    </script>
</body>
</html>
