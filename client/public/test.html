<!DOCTYPE html>
<html>
<head>
    <title>FlixHub Direct Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #0a0a0f; 
            color: white;
            padding: 20px;
        }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border-left: 4px solid #00f0ff;
        }
        .success { background: rgba(0, 255, 0, 0.1); border-color: #00ff00; }
        .error { background: rgba(255, 0, 0, 0.1); border-color: #ff0000; }
        .info { background: rgba(0, 240, 255, 0.1); border-color: #00f0ff; }
    </style>
</head>
<body>
    <h1>🎬 FlixHub Connection Test</h1>
    <div id="results"></div>
    
    <div class="status info">
        <h3>Testing Instructions:</h3>
        <ol>
            <li>Open a new browser tab</li>
            <li>Go to <strong>http://localhost:5173</strong></li>
            <li>Check if the website loads without black screen</li>
            <li>Press F12 to open Developer Tools</li>
            <li>Check the Console tab for any red error messages</li>
        </ol>
    </div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            results.appendChild(div);
        }
        
        addResult('🔍 Testing FlixHub connections...', 'info');
        
        // Test frontend server
        fetch('http://localhost:5173')
            .then(response => {
                if (response.ok) {
                    addResult('✅ Frontend server is responding (http://localhost:5173)', 'success');
                } else {
                    addResult('❌ Frontend server error: HTTP ' + response.status, 'error');
                }
            })
            .catch(error => {
                addResult('❌ Cannot connect to frontend server: ' + error.message, 'error');
            });
            
        // Test backend server
        fetch('http://localhost:5000/api/products')
            .then(response => {
                if (response.ok) {
                    addResult('✅ Backend server is responding (http://localhost:5000)', 'success');
                    return response.json();
                } else {
                    addResult('⚠️ Backend server responded with HTTP ' + response.status, 'error');
                }
            })
            .then(data => {
                if (data) {
                    addResult('✅ Backend API is working - Found ' + (data.length || 0) + ' products', 'success');
                }
            })
            .catch(error => {
                addResult('⚠️ Backend server issue (this is OK for now): ' + error.message, 'info');
            });
            
        // Show next steps
        setTimeout(() => {
            addResult('🚀 <strong>Next Steps:</strong><br/>1. Go to <a href="http://localhost:5173" target="_blank" style="color: #00f0ff;">http://localhost:5173</a><br/>2. The website should now load properly<br/>3. If you still see black screen, press Ctrl+Shift+R for hard refresh', 'info');
        }, 2000);
    </script>
</body>
</html>
