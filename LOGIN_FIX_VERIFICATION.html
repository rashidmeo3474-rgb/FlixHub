<!DOCTYPE html>
<html>
<head>
    <title>FlixHub Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 15px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🔑 FlixHub Login System Test</h1>
    
    <div class="info">
        <strong>Test Credentials:</strong><br>
        Email: businessyttom@gmail.com<br>
        Password: admin123
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="businessyttom@gmail.com" required>
        </div>
        
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="admin123" required>
        </div>
        
        <button type="submit">Test Login</button>
    </form>

    <div id="result"></div>

    <script>
        // Test login function
        async function testLogin(email, password) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info">Testing login...</div>';

            try {
                // Try server first
                const response = await fetch('http://localhost:5000/api/auth/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✅ LOGIN SUCCESS!</strong><br>
                            Token: ${data.token}<br>
                            User: ${data.user.name} (${data.user.role})<br>
                            Email: ${data.user.email}
                        </div>
                    `;
                    return { success: true, data };
                } else {
                    throw new Error(data.message || 'Login failed');
                }
            } catch (error) {
                console.log('Server error, trying mock auth:', error.message);
                
                // Fallback mock authentication
                if ((email === 'businessyttom@gmail.com' || email === 'admin@flixhub.pk') && password === 'admin123') {
                    const mockData = {
                        token: 'mock-admin-token-' + Date.now(),
                        user: {
                            _id: 'admin123',
                            name: 'Admin User',
                            email: email,
                            role: 'admin',
                            phone: '',
                            createdAt: new Date().toISOString()
                        }
                    };
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✅ MOCK LOGIN SUCCESS!</strong><br>
                            Token: ${mockData.token}<br>
                            User: ${mockData.user.name} (${mockData.user.role})<br>
                            Email: ${mockData.user.email}<br>
                            <em>Note: Using mock authentication (server unavailable)</em>
                        </div>
                    `;
                    return { success: true, data: mockData };
                }
                
                resultDiv.innerHTML = `
                    <div class="error">
                        <strong>❌ LOGIN FAILED!</strong><br>
                        Error: ${error.message}<br>
                        <em>Make sure email is businessyttom@gmail.com and password is admin123</em>
                    </div>
                `;
                return { success: false, error: error.message };
            }
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            await testLogin(email, password);
        });

        // Auto-test on page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                testLogin('businessyttom@gmail.com', 'admin123');
            }, 1000);
        });
    </script>
</body>
</html>
